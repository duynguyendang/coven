# Every push and pull request runs what a change must pass before it is committed (AGENTS.md: `make verify`):
# types, the cross-file harness, the Python and Node suites. Nothing here calls a model, deploys or pushes.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Git identity for the tests that commit in throw-away repos
        run: |
          git config --global user.email "ci@coven.invalid"
          git config --global user.name "Coven CI"
      - name: Install
        run: make install
      - name: Verify
        run: make verify
