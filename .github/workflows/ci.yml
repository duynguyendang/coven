# What a change must pass before it is committed (AGENTS.md: `make verify`), on every push and pull request:
# the cloud's type check, the cross-file harness, the Python suite (it starts the Node cloud, so Node 22.18 is
# installed for it too) and the Node suite; and the Worker's type check. Nothing here calls a model, deploys or pushes.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Git identity for the tests that commit in throw-away repos
        run: |
          git config --global user.email "ci@coven.invalid"
          git config --global user.name "Coven CI"
      - name: Install
        run: make install
      - name: Cloud type check
        run: cd server && npx tsc --noEmit
      - name: Harness and Python suite
        run: PYTHONPATH=src python -m pytest
      - name: Node suite
        run: cd server && node --test "test/**/*.test.ts"

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: server/worker
      - name: Worker type check (server/worker)
        run: npx wrangler types && npx tsc --noEmit
        working-directory: server/worker
